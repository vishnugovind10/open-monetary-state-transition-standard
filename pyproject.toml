[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omst"
version = "0.7.0"
description = "Open Monetary State & Transition Standard reference implementation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "OMST contributors"}]
keywords = ["digital-money", "tokenised-money", "settlement", "financial-infrastructure", "open-standard"]
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "types-jsonschema>=4.24"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
omst = "omst.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omst"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
